[workspace]
resolver = "3"
members = ["crates/findest-core", "crates/findest"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
findest-core = { path = "crates/findest-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
dirs = "6"
trash = "5"
notify = "8"
chrono = "0.4"
schemars = "1"
# `runtime_shaders` avoids needing Xcode's separately-downloaded Metal toolchain at build time.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
unicode-segmentation = "1"
futures = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["objc2-core-graphics", "objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = "0.3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
